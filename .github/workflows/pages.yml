# Сайт на GitHub Pages: каждый пуш в main — тесты, сборка под /challenge-tracker/, выкладка.
# Адрес и ключ Supabase — секреты репозитория VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions). Anon-ключ публичный по замыслу, данные закрывает RLS.
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm test

      - name: Секреты Supabase на месте
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Нет секретов VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY — без них сайт покажет экран настройки. Не выкладываю."
            exit 1
          fi

      - name: Сборка
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build -- --base=/challenge-tracker/

      # Pages отдаёт 404.html на незнакомый адрес — это копия сайта, маршрут разбирает react-router.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
